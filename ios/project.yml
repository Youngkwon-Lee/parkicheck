name: ParkiCheck
options:
  bundleIdPrefix: app.parkicheck
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ParkiCheck:
    type: application
    platform: iOS
    sources: [ParkiCheck]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.parkicheck.selflog
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: ParkiCheck
        INFOPLIST_KEY_NSCameraUsageDescription: "손가락 탭핑 동작을 기록하기 위해 전면 카메라를 사용합니다. 영상은 기기 안에서만 처리되며 저장하거나 전송하지 않습니다."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  ParkiCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ParkiCheckTests]
    dependencies:
      - target: ParkiCheck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ParkiCheck:
    build:
      targets:
        ParkiCheck: all
    test:
      targets: [ParkiCheckTests]
