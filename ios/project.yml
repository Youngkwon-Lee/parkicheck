name: ParkiCheck
options:
  bundleIdPrefix: app.parkicheck
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ZJZ9ZD3PCU
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ParkiCheck:
    type: application
    platform: iOS
    sources: [ParkiCheck]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.parkicheck.selflog
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: ParkiCheck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
        INFOPLIST_KEY_NSCameraUsageDescription: "움직임 검사(손가락 탭핑, 걷기 등)를 기록하기 위해 전면 카메라를 사용합니다. 영상은 기기 안에서만 처리되며 저장하거나 전송하지 않습니다."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "말로 약 복용과 몸 상태를 기록할 때 마이크를 사용합니다. 녹음 파일은 저장하지 않습니다."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "말한 내용을 글자로 바꿔 기록하기 위해 음성 인식을 사용합니다. 가능한 경우 기기 안에서만 처리합니다."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  ParkiCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ParkiCheckTests]
    dependencies:
      - target: ParkiCheck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ParkiCheck:
    build:
      targets:
        ParkiCheck: all
    test:
      targets: [ParkiCheckTests]
